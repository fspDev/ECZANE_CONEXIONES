name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos que necesita actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy por vez; no cancela el que ya esta corriendo
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Requiere que Pages ya este habilitado en el repo:
      # Settings > Pages > Source: "GitHub Actions".
      # Es un paso manual de una sola vez: GITHUB_TOKEN no tiene
      # permisos para activarlo por su cuenta.
      - name: Configurar Pages
        uses: actions/configure-pages@v5

      # La app es estatica: se sube la carpeta app/ tal cual, sin build.
      - name: Subir la carpeta app/
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
